about:
  title: "About"
  description: |
    I started out building interfaces and ended up happiest owning the whole feature. Day to day that means Vue and Nuxt on the front, TypeScript services and SQL behind them, and enough Docker and Linux to ship without waiting on someone else.

    I care about the boring parts: fast pages, clean data, and software that still works a year later. Lately I've been leaning on AI tooling to move faster without skipping the fundamentals.
  stats:
    - value: "10+"
      label: "hospitality venues running Dishboard"
    - value: "3+"
      label: "years shipping production web apps"

