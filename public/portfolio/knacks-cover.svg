<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" xml:space="preserve">
  <defs>
    <radialGradient id="glow" cx="22%" cy="14%" r="70%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#34d399" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0a0f0d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1c2a23"/>
    </pattern>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101a15"/>
      <stop offset="100%" stop-color="#0c1411"/>
    </linearGradient>
    <style>
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", "Menlo", "Consolas", monospace; }
      .dim { fill: #6b7d74; }
      .txt { fill: #dbe6e0; }
      .em { fill: #34d399; }
      .name { fill: #eef4f0; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#0a0f0d"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <g>
    <rect x="150" y="130" width="1300" height="740" rx="18" fill="url(#win)" stroke="#26362e" stroke-width="2"/>
    <path d="M150 148 a18 18 0 0 1 18 -18 h1264 a18 18 0 0 1 18 18 v66 h-1300 z" fill="#0b1310"/>
    <line x1="150" y1="214" x2="1450" y2="214" stroke="#1e2c25" stroke-width="2"/>
    <circle cx="192" cy="178" r="8" fill="#3a4a42"/>
    <circle cx="220" cy="178" r="8" fill="#3a4a42"/>
    <circle cx="248" cy="178" r="8" fill="#3a4a42"/>
    <text x="800" y="186" text-anchor="middle" class="mono dim" font-size="19">knacks — agent skills</text>

    <g class="mono" font-size="27">
      <text x="200" y="290"><tspan class="em">$</tspan><tspan class="txt"> knacks list</tspan></text>

      <g font-size="24">
        <text x="200" y="368"><tspan class="em">✓</tspan><tspan class="name" dx="14">accessibility-audit</tspan><tspan class="dim" dx="150">project</tspan><tspan class="dim" dx="120">.agents/skills</tspan></text>
        <text x="200" y="424"><tspan class="em">✓</tspan><tspan class="name" dx="14">api-design-review</tspan><tspan class="dim" dx="166">global</tspan><tspan class="dim" dx="120">~/.claude/skills</tspan></text>
        <text x="200" y="480"><tspan class="em">✓</tspan><tspan class="name" dx="14">convex-best-practices</tspan><tspan class="dim" dx="94">global</tspan><tspan class="dim" dx="120">~/.agents/skills</tspan></text>
        <text x="200" y="536"><tspan class="em">✓</tspan><tspan class="name" dx="14">commit-messages</tspan><tspan class="dim" dx="238">project</tspan><tspan class="dim" dx="120">.cursor/skills</tspan></text>
        <text x="200" y="592"><tspan class="dim">○</tspan><tspan class="dim" dx="14">unslop</tspan><tspan class="dim" dx="376">global</tspan><tspan class="dim" dx="120">~/.codex/skills</tspan></text>
        <text x="200" y="648"><tspan class="dim">○</tspan><tspan class="dim" dx="14">find-skills</tspan><tspan class="dim" dx="364">global</tspan><tspan class="dim" dx="120">~/.agents/skills</tspan></text>
      </g>

      <text x="200" y="740"><tspan class="em">$</tspan><tspan class="txt"> knacks install anthropics/skills@pdf</tspan></text>
      <text x="200" y="800"><tspan class="dim">installed </tspan><tspan class="name">pdf</tspan><tspan class="dim"> → .agents/skills/pdf</tspan></text>
    </g>
  </g>

  <text x="150" y="960" class="mono" font-size="20" fill="#3f5348">Go · TUI · CLI · open source at github.com/BeytulaS/knacks</text>
</svg>
